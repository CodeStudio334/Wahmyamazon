<!DOCTYPE html>
<html lang="ar-sa" class="a-js a-rtl a-ember" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>إتمام الشراء - Amazon.sa</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body class="a-ember">
    <header class="checkout-top-banner">
        <a href="index.html">
            <svg class="amz-official-logo-svg" viewBox="0 0 135 42" xmlns="http://www.w3.org/2000/svg">
                <text x="128" y="25" fill="#111111" font-family="'Amazon Ember', Arial, Helvetica, sans-serif" font-weight="700" font-size="25" letter-spacing="-0.8" text-anchor="start">amazon</text>
                <text x="34" y="25" fill="#111111" font-family="'Amazon Ember', Arial, Helvetica, sans-serif" font-weight="400" font-size="15" text-anchor="start">.sa</text>
                <path d="M 42 30 Q 78 41 116 29" stroke="#FF9900" stroke-width="2.7" fill="none" stroke-linecap="round"/>
                <path d="M 111 26.5 L 118.5 28.5 L 114.5 34.5" stroke="#FF9900" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </a>
        <h1 class="a-size-large">إتمام الشراء (<span id="checkoutItemCount">0</span> سلعة)</h1>
        <span>🔒</span>
    </header>

    <main class="a-container pdp-container">
        <div class="checkout-layout">
            <div>
                <div class="a-box" style="margin-bottom: 16px;">
                    <div class="a-box-inner">
                        <h3 class="a-size-medium a-text-bold" style="margin-bottom: 12px;">1. عنوان الشحن</h3>
                        <div class="amz-field">
                            <label>الاسم الكامل</label>
                            <input type="text" id="fullName" class="a-input-text" value="سلطان الزهراني">
                        </div>
                        <div class="amz-field">
                            <label>الشارع والحي</label>
                            <input type="text" id="address" class="a-input-text" value="حي الياسمين، طريق الملك عبدالعزيز">
                        </div>
                        <div class="amz-field">
                            <label>المدينة</label>
                            <input type="text" id="city" class="a-input-text" value="الرياض، المملكة العربية السعودية">
                        </div>
                    </div>
                </div>

                <div class="a-box">
                    <div class="a-box-inner">
                        <h3 class="a-size-medium a-text-bold" style="margin-bottom: 12px;">2. طريقة الدفع</h3>
                        <label class="pay-choice-box">
                            <input type="radio" name="pay" checked>
                            <div>
                                <strong>بطاقة مدى البنكية المنتهية بـ 4829</strong>
                                <div class="a-size-small a-color-secondary">سلطان الزهراني - محاكاة دفع آمنة</div>
                            </div>
                        </label>
                        <label class="pay-choice-box">
                            <input type="radio" name="pay">
                            <div>
                                <strong>الدفع عند الاستلام (COD)</strong>
                                <div class="a-size-small a-color-secondary">الدفع نقداً أو بالبطاقة عند الاستلام</div>
                            </div>
                        </label>
                    </div>
                </div>
            </div>

            <div class="a-box" style="height: fit-content;">
                <div class="a-box-inner">
                    <button id="confirmOrderBtn" class="amz-pill-yellow">تأكيد الطلب والشراء</button>
                    <p class="a-size-mini a-color-secondary" style="margin-top: 8px;">بإتمامك لهذا الطلب، فإنك توافق على شروط الاستخدام وإشعار الخصوصية الخاص بأمازون (بيئة محاكاة ترفيهية).</p>
                    <hr class="a-divider-normal">
                    <h3 class="a-size-base a-text-bold">ملخص الطلب</h3>
                    <div id="checkoutItemsSummary" style="margin: 10px 0;"></div>
                    <div class="sum-row"><span>السلع:</span><span id="itemsSub">﷼ 0.00</span></div>
                    <div class="sum-row"><span>الشحن والتغليف:</span><span>﷼ 0.00</span></div>
                    <hr class="a-divider-normal">
                    <div class="sum-row a-color-price a-size-medium a-text-bold"><span>إجمالي الطلب:</span><span id="checkoutTotal">﷼ 0.00</span></div>
                </div>
            </div>
        </div>
    </main>

    <script src="assets/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', initCheckoutPage);
    </script>
</body>
</html>
