<!DOCTYPE html>
<html lang="ar-sa" class="a-js a-rtl a-ember" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>تتبع الشحنة - Amazon.sa</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body class="a-ember">
    <header id="navbar-main">
        <div id="navbar">
            <div id="nav-belt">
                <div class="nav-right-group">
                    <a href="index.html" id="nav-logo-sprites" class="nav-logo-link">
                        <svg class="amz-official-logo-svg" viewBox="0 0 135 42" xmlns="http://www.w3.org/2000/svg">
                            <text x="128" y="25" fill="#FFFFFF" font-family="'Amazon Ember', Arial, Helvetica, sans-serif" font-weight="700" font-size="25" letter-spacing="-0.8" text-anchor="start">amazon</text>
                            <text x="34" y="25" fill="#FFFFFF" font-family="'Amazon Ember', Arial, Helvetica, sans-serif" font-weight="400" font-size="15" text-anchor="start">.sa</text>
                            <path d="M 42 30 Q 78 41 116 29" stroke="#FF9900" stroke-width="2.7" fill="none" stroke-linecap="round"/>
                            <path d="M 111 26.5 L 118.5 28.5 L 114.5 34.5" stroke="#FF9900" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </a>
                </div>
                <div id="nav-tools">
                    <a href="orders.html" id="nav-orders" class="nav-a nav-a-2">
                        <span class="nav-line-1">الإرجاع</span>
                        <span class="nav-line-2">و الطلبات</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main class="a-container pdp-container">
        <div class="a-breadcrumb"><a href="orders.html">‹ العودة إلى طلباتك</a></div>

        <div class="a-box" style="max-width: 820px; margin: 0 auto;">
            <div class="a-box-inner">
                <h2 id="currentStageHeadline" class="a-size-large a-color-success a-text-bold">جاري التحديث...</h2>
                <p id="orderIdText" class="a-size-small a-color-secondary" style="margin-bottom: 14px;">رقم الطلب: 405-0000000-0000000</p>
                <hr class="a-divider-normal">
                <div id="trackingProductInfo" style="margin: 14px 0;"></div>
                <hr class="a-divider-normal">
                <h3 class="a-size-medium a-text-bold" style="margin: 14px 0;">مراحل تتبع الشحنة</h3>
                <div class="amz-timeline" id="stagesTimeline"></div>
            </div>
        </div>
    </main>

    <script src="assets/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', renderTrackingPage);
    </script>
</body>
</html>
